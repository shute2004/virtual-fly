[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-fly-tools"
version = "0.1.0"
description = "Research tools for the connectome-initialized virtual-fly project"
readme = "README.md"
authors = [{ name = "shute2004" }]
keywords = ["Drosophila", "connectome", "computational-neuroscience", "synaptic-plasticity", "MuJoCo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "flygym==2.1.0",
    "numpy>=2.0,<3.0",
    "pandas>=3.0,<4.0",
    "pyarrow>=18.0",
]

[project.urls]
Homepage = "https://github.com/shute2004/virtual-fly"
Repository = "https://github.com/shute2004/virtual-fly"
Documentation = "https://github.com/shute2004/virtual-fly/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]
include = ["virtual_fly*"]
