[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-fly-tools"
version = "0.1.0"
description = "Data preparation, embodiment, and analysis tools for virtual-fly"
requires-python = ">=3.12,<3.15"
dependencies = [
    "flygym==2.1.0",
    "numpy>=2.0,<3.0",
    "pandas>=3.0,<4.0",
    "pyarrow>=18.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["virtual_fly*"]
